<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact - COSEY STAYS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <script defer src="js/main.js"></script>
</head>
<body class="p-6 bg-white min-h-screen">
  <header class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Contact</h1>
    <nav class="space-x-4">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
    </nav>
  </header>

  <main class="max-w-2xl mx-auto card">
    <form name="contact" method="POST" data-netlify="true" class="space-y-4">
      <input type="hidden" name="form-name" value="contact">
      <label class="block">Name<br><input name="name" class="w-full border px-3 py-2 rounded" required></label>
      <label class="block">Email<br><input type="email" name="email" class="w-full border px-3 py-2 rounded" required></label>
      <label class="block">Message<br><textarea name="message" class="w-full border px-3 py-2 rounded" rows="6" required></textarea></label>
      <button class="px-4 py-2 bg-gradient-to-r from-orange-400 to-red-500 text-white rounded-lg shadow-md hover:translate-y-[-2px] transition-transform">Send</button>
    </form>
  </main>
  <footer class="site-footer text-center">
    <div class="max-w-2xl mx-auto">Questions? Email hello@coseystays.example</div>
  </footer>

</body>
</html>
