<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery - COSEY STAYS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <script defer src="js/main.js"></script>
</head>
<body class="p-6 bg-gray-50 min-h-screen">
  <header class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Gallery</h1>
    <nav class="space-x-4">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto">
    <section class="mb-6">
      <h2 class="text-2xl font-semibold mb-4">Our spaces</h2>
      <p class="text-muted mb-4">Tap an image to view a larger preview.</p>
      <div class="gallery-grid">
        <img src="images/apartment.jpg" alt="Cozy Apartment">
        <img src="images/villa.jpg" alt="Luxury Villa">
        <img src="images/cottage.jpg" alt="Charming Cottage">
        <img src="images/bcg.jpg" alt="Scenic View">
      </div>
    </section>
</main>
  <footer class="site-footer text-center">
    <div class="max-w-6xl mx-auto">© 2026 COSEY STAYS — Photos are for illustration only.</div>
  </footer>
</body>
</html>
